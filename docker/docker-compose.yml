name: agro-ecommerce-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: agro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agro_network

  redis:
    image: redis:7.2-alpine
    container_name: agro_redis
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server
      --appendonly yes
      --save 60 1000
      --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agro_network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agro_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"

      # Announce external URL so presigned URLs resolve correctly
      MINIO_SERVER_URL: "${MINIO_SERVER_URL:-http://localhost:9000}"
      MINIO_BROWSER_REDIRECT_URL: "${MINIO_CONSOLE_URL:-http://localhost:9001}"

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - agro_network

networks:
  agro_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

  redis_data:
    driver: local

  minio_data:
    driver: local
